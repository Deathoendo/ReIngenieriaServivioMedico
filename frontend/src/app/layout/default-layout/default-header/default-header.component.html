<c-container [fluid]="true">
  <button cSidebarToggle="sidebar" class="header-toggler" style="margin-inline-start: -14px">
    <svg cIcon name="cilMenu" size="lg"></svg>
  </button>

  <c-breadcrumb-router class="ms-2"></c-breadcrumb-router>

  <c-header-nav class="ms-auto">
    <div cDropdown class="nav-item">
      <a cDropdownToggle class="py-0 d-flex align-items-center" href>
        <c-avatar src="/assets/images/avatars/10.png" size="md" status="success"></c-avatar>
      </a>

      <ul cDropdownMenu class="pt-0">
        <li cDropdownHeader class="bg-body-tertiary fw-semibold py-2">
          {{ auth.nombre() || 'Sesión activa' }}
        </li>
        <li><hr cDropdownDivider /></li>
        <li>
          <a cDropdownItem (click)="cerrarSesion()" role="button" tabindex="0">
            <svg cIcon class="me-2" name="cilAccountLogout"></svg>
            Cerrar sesión
          </a>
        </li>
      </ul>
    </div>
  </c-header-nav>
</c-container>
